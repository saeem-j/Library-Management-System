{% extends "base.html" %}
{% block title %}Delete Book | Library Management{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Delete Book</h2>
    <p class="muted">Are you sure you want to delete "{{ book.book_name }}" issued to {{ book.student_name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn red" type="submit">Yes, Delete</button>
        <a class="btn gray" href="{% url 'view_books' %}">Cancel</a>
    </form>
    </div>
{% endblock %}
