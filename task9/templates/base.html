<!DOCTYPE html>
<html>
<head>

    <title>
        {% block title %}
        Loan Checker
        {% endblock %}
    </title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        nav {
            background-color: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        h1 {
            text-align: center;
        }

        .result {
            background-color: #e8f5e9;
            padding: 15px;
            text-align: center;
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/loan/">
            Loan Checker
        </a>

    </nav>


    <div class="container">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
