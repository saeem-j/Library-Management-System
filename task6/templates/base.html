<!doctype html>
<html>
  <head>
    <title>{% block title %}Django Task{% endblock %}</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f6f8;
        margin: 0;
      }
      .container {
        width: 90%;
        max-width: 1100px;
        margin: 30px auto;
      }
      nav {
        background: #222;
        padding: 15px;
        color: white;
      }
      nav a {
        color: white;
        text-decoration: none;
      }
      h1 {
        text-align: center;
      }
      .box {
        background: white;
        padding: 30px;
        max-width: 500px;
        margin: auto;
        border-radius: 10px;
      }
      .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }
      .card {
        background: white;
        width: 220px;
        padding: 15px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 2px 8px #ccc;
      }
      .card img {
        width: 180px;
        height: 130px;
        object-fit: cover;
      }
      .pass,
      .available {
        color: green;
      }
      .fail,
      .notavailable,
      .premium {
        color: red;
      }
    </style>
  </head>
  <body>
    <nav><a href="/">Django Task</a></nav>
    <div class="container">{% block content %}{% endblock %}</div>
  </body>
</html>
